```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="A magical birthday celebration made with love."
  >

  <title>Happy Birthday ❤️</title>

  <link rel="stylesheet" href="Birth.css">
</head>

<body>

  <!-- =====================================================
       BACKGROUND
       ===================================================== -->

  <div id="stars"></div>
  <div id="dust"></div>

  <!-- =====================================================
       MAIN BIRTHDAY EXPERIENCE
       ===================================================== -->

  <main class="birthday-container">

    <!-- Opening / Welcome Section -->
    <section class="birthday-screen" id="birthdayScreen">

      <div class="birthday-content">

        <p class="eyebrow">
          ✨ A little surprise for you ✨
        </p>

        <h1>
          Happy Birthday
        </h1>

        <p class="birthday-message">
          Today is all about celebrating you.
        </p>

        <button
          id="startButton"
          class="start-button"
          type="button"
        >
          Open Your Surprise ❤️
        </button>

      </div>

    </section>


    <!-- ===================================================
         MAGICAL TREE
         =================================================== -->

    <section
      class="tree-stage"
      id="treeStage"
      aria-hidden="true"
    >

      <div class="tree-trunk"></div>

      <div class="tree-branches"></div>

      <div class="tree-leaves"></div>

      <div class="tree-particles"></div>

    </section>


    <!-- ===================================================
         HEART EFFECTS
         =================================================== -->

    <div
      id="heartOrbit"
      class="heart-orbit"
      aria-hidden="true"
    ></div>

    <div
      id="heartRise"
      class="heart-rise"
      aria-hidden="true"
    ></div>


    <!-- ===================================================
         FLOWERS / BLOSSOMS
         =================================================== -->

    <div
      id="blossoms"
      class="blossoms"
      aria-hidden="true"
    ></div>


    <!-- ===================================================
         BUTTERFLIES
         =================================================== -->

    <div
      id="butterflies"
      class="butterflies"
      aria-hidden="true"
    ></div>


    <!-- ===================================================
         LANTERNS
         =================================================== -->

    <div
      id="lanterns"
      class="lanterns"
      aria-hidden="true"
    ></div>


    <!-- ===================================================
         BALLOONS
         =================================================== -->

    <div
      id="balloons"
      class="balloons"
      aria-hidden="true"
    ></div>


    <!-- ===================================================
         FIREWORKS
         =================================================== -->

    <div
      id="fireworks"
      class="fireworks"
      aria-hidden="true"
    ></div>


    <!-- ===================================================
         CONFETTI
         =================================================== -->

    <div
      id="confetti"
      class="confetti"
      aria-hidden="true"
    ></div>


    <!-- ===================================================
         FINAL MESSAGE
         =================================================== -->

    <section
      id="finalMessage"
      class="final-message"
      aria-hidden="true"
    >

      <h2>
        🎂 Happy Birthday! 🎉
      </h2>

      <p>
        May your day be filled with happiness,
        laughter, love and beautiful memories. ❤️
      </p>

    </section>

  </main>


  <!-- JavaScript -->
  <script src="Birth.js"></script>

</body>
</html>
```
